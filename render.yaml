# Render.com static site – generated by build.py (edit REDIRECTS in build.py, not here)
services:
  - type: web
    name: eld-website
    runtime: static
    buildCommand: python3 build.py
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    buildFilter:
      ignoredPaths:
        - server/**
        - README.md
    headers:
      - path: /version.json
        name: Cache-Control
        value: no-store
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: redirect
        source: /shed-construction/
        destination: /shed-construction/indoor-arena-construction-equestrian-land-developments/
      - type: redirect
        source: /product-category/products/
        destination: /shop/
      - type: redirect
        source: /cart/
        destination: /shop/
      - type: redirect
        source: /checkout/
        destination: /shop/
      - type: redirect
        source: /my-account/
        destination: /shop/
      - type: redirect
        source: /my-account/lost-password/
        destination: /shop/
      - type: redirect
        source: /home/
        destination: /
      - type: redirect
        source: /wp-content/uploads/2026/03/ELD_Maintenance-Tips_A4_2026-1.pdf
        destination: /assets/docs/ELD-Maintenance-Tips-2026.pdf
      - type: redirect
        source: /wp-content/uploads/2026/03/ELD_Spread-a-bar_Tips_A4_2026-1.pdf
        destination: /assets/docs/ELD-Spread-a-bar-Tips-2026.pdf
      - type: redirect
        source: /wp-content/uploads/2026/03/ELD_SyntheticSurfaces_A4_2026.pdf
        destination: /assets/docs/ELD-Synthetic-Surfaces-2026.pdf
      - type: redirect
        source: /wp-content/uploads/2026/10/Indoor-Arena-Construction-Tips-Advice-2026-6.pdf
        destination: /assets/docs/Indoor-Arena-Construction-Tips-Advice-2026.pdf
      - type: redirect
        source: /wp-content/uploads/2022/12/ELD_Spread-a-bar_A4_2022.pdf
        destination: /assets/docs/ELD-Spread-a-bar-2022.pdf
      - type: redirect
        source: /admin
        destination: https://eld-admin.onrender.com/admin
      - type: redirect
        source: /admin/
        destination: https://eld-admin.onrender.com/admin
      - type: redirect
        source: /news/category/*
        destination: /news/
      - type: redirect
        source: /news/tag/*
        destination: /news/
      - type: redirect
        source: /news/author/*
        destination: /news/
      - type: redirect
        source: /product-category/*
        destination: /shop/

  - type: web
    name: eld-admin
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GITHUB_REPO
        value: AusJumping/eld-website
      - key: SITE_URL
        value: https://eld-website.onrender.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
